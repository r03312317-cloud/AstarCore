<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="microsoft yahei, segoe ui, sans-serif">
  <rect width="980" height="640" fill="#f7f9fc"/>
  <text x="490" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#16233b">rv32_core_01 I2W2 · 100 MHz 游戏 SoC（PG2L200H-6FBB676）</text>

  <!-- clock sources -->
  <rect x="20" y="60" width="170" height="54" rx="6" fill="#e8f0fe" stroke="#4a7fd4"/>
  <text x="105" y="82" text-anchor="middle" font-size="12" fill="#16233b">27 MHz 晶振 (D18)</text>
  <text x="105" y="100" text-anchor="middle" font-size="11" fill="#3b5a86">HDMI PLL 27 / 135 MHz</text>

  <rect x="20" y="126" width="170" height="54" rx="6" fill="#e8f0fe" stroke="#4a7fd4"/>
  <text x="105" y="148" text-anchor="middle" font-size="12" fill="#16233b">125 MHz 差分 (N3/N2)</text>
  <text x="105" y="166" text-anchor="middle" font-size="11" fill="#3b5a86">CPU PLL 100 MHz · DDR 参考</text>

  <!-- SoC -->
  <rect x="215" y="52" width="560" height="420" rx="10" fill="#ffffff" stroke="#2c4a75" stroke-width="2"/>
  <text x="495" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#16233b">game_soc_top</text>

  <rect x="235" y="88" width="170" height="86" rx="6" fill="#eaf6ee" stroke="#3f8f5c"/>
  <text x="320" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#16233b">rv32_ooo_core</text>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="#2f6a45">RV32IM 双发射乱序</text>
  <text x="320" y="143" text-anchor="middle" font-size="11" fill="#2f6a45">100 MHz · H5/I8</text>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#2f6a45">代码/数据 SRAM 64+64 KiB</text>

  <rect x="235" y="186" width="170" height="54" rx="6" fill="#eef2fb" stroke="#4a7fd4"/>
  <text x="320" y="207" text-anchor="middle" font-size="12" fill="#16233b">I/D-cache 均为双路</text>
  <text x="320" y="224" text-anchor="middle" font-size="11" fill="#3b5a86">DDR 非缓存旁路</text>

  <rect x="235" y="252" width="170" height="72" rx="6" fill="#fff6e6" stroke="#c98a2a"/>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#16233b">CPU MMIO</text>
  <text x="320" y="289" text-anchor="middle" font-size="11" fill="#8a5f18">0x3000_0000 CP13</text>
  <text x="320" y="305" text-anchor="middle" font-size="11" fill="#8a5f18">0x6000_1xxx 游戏窗口</text>

  <rect x="440" y="88" width="150" height="86" rx="6" fill="#eef2fb" stroke="#4a7fd4"/>
  <text x="515" y="110" text-anchor="middle" font-size="12" fill="#16233b">pg_memory_cdc ×2</text>
  <text x="515" y="128" text-anchor="middle" font-size="11" fill="#3b5a86">I/D 两路请求仲裁</text>
  <text x="515" y="145" text-anchor="middle" font-size="11" fill="#3b5a86">DDR 突发桥</text>
  <text x="515" y="162" text-anchor="middle" font-size="11" fill="#3b5a86">AXI 双主仲裁</text>

  <rect x="440" y="186" width="150" height="70" rx="6" fill="#f3ecfb" stroke="#7a54b8"/>
  <text x="515" y="207" text-anchor="middle" font-size="12" fill="#16233b">game_video_ctrl</text>
  <text x="515" y="224" text-anchor="middle" font-size="11" fill="#54398a">双缓冲发布</text>
  <text x="515" y="241" text-anchor="middle" font-size="11" fill="#54398a">pg_mmio_cdc</text>

  <rect x="440" y="268" width="150" height="56" rx="6" fill="#fdeceb" stroke="#b8503f"/>
  <text x="515" y="289" text-anchor="middle" font-size="12" fill="#16233b">game_input</text>
  <text x="515" y="306" text-anchor="middle" font-size="11" fill="#8c3a2d">去抖 / 边沿 / 长按</text>

  <rect x="620" y="88" width="130" height="86" rx="6" fill="#e6f4f7" stroke="#2f8b9e"/>
  <text x="685" y="110" text-anchor="middle" font-size="12" fill="#16233b">HDMI 扫描输出</text>
  <text x="685" y="128" text-anchor="middle" font-size="11" fill="#1f6a7a">640×360 → 480p</text>
  <text x="685" y="145" text-anchor="middle" font-size="11" fill="#1f6a7a">1:1 居中显示</text>
  <text x="685" y="162" text-anchor="middle" font-size="11" fill="#1f6a7a">行缓存 + 异步 FIFO</text>

  <rect x="620" y="186" width="130" height="70" rx="6" fill="#e6f4f7" stroke="#2f8b9e"/>
  <text x="685" y="207" text-anchor="middle" font-size="12" fill="#16233b">soc_mini_hdmi_tx</text>
  <text x="685" y="224" text-anchor="middle" font-size="11" fill="#1f6a7a">TMDS 编码</text>
  <text x="685" y="241" text-anchor="middle" font-size="11" fill="#1f6a7a">5:1 串行化</text>

  <rect x="440" y="340" width="310" height="52" rx="6" fill="#f2f4f7" stroke="#5b6b80"/>
  <text x="595" y="361" text-anchor="middle" font-size="12" fill="#16233b">soc_hmic_axi_adapter（AXI128 → AXI256）</text>
  <text x="595" y="379" text-anchor="middle" font-size="11" fill="#46566b">每笔突发完整持有所有权，RLAST/B 严格配对</text>

  <rect x="440" y="404" width="310" height="52" rx="6" fill="#f2f4f7" stroke="#5b6b80"/>
  <text x="595" y="425" text-anchor="middle" font-size="12" fill="#16233b">soc_ddr800（厂商 DDR3 控制器 + PHY）</text>
  <text x="595" y="443" text-anchor="middle" font-size="11" fill="#46566b">750 MT/s · UI 93.75 MHz · 32 bit</text>

  <!-- outside -->
  <rect x="800" y="88" width="160" height="86" rx="6" fill="#ffffff" stroke="#b8503f"/>
  <text x="880" y="112" text-anchor="middle" font-size="12" fill="#16233b">HDMI 连接器</text>
  <text x="880" y="132" text-anchor="middle" font-size="11" fill="#8c3a2d">720×480@60</text>
  <text x="880" y="150" text-anchor="middle" font-size="11" fill="#8c3a2d">TMDS 差分对</text>

  <rect x="800" y="268" width="160" height="76" rx="6" fill="#ffffff" stroke="#c98a2a"/>
  <text x="880" y="290" text-anchor="middle" font-size="12" fill="#16233b">按键</text>
  <text x="880" y="308" text-anchor="middle" font-size="11" fill="#8a5f18">C23/B22/A22/B20/C22</text>
  <text x="880" y="325" text-anchor="middle" font-size="11" fill="#8a5f18">仅板载五键（默认）</text>

  <rect x="20" y="404" width="380" height="120" rx="6" fill="#fdf6f4" stroke="#b8503f"/>
  <text x="210" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#16233b">DDR 帧缓冲（非缓存窗口）</text>
  <text x="210" y="446" text-anchor="middle" font-size="11" fill="#8c3a2d">0x8200_0000  FB0  640×360 RGB565 = 460,800 B</text>
  <text x="210" y="464" text-anchor="middle" font-size="11" fill="#8c3a2d">0x8210_0000  FB1  同上（双缓冲）</text>
  <text x="210" y="482" text-anchor="middle" font-size="11" fill="#8c3a2d">CPU 只写“不在扫描”的那一块</text>
  <text x="210" y="500" text-anchor="middle" font-size="11" fill="#8c3a2d">COMMIT → 下一场消隐切换，无撕裂</text>

  <rect x="20" y="200" width="170" height="76" rx="6" fill="#ffffff" stroke="#5b6b80"/>
  <text x="105" y="222" text-anchor="middle" font-size="12" fill="#16233b">UART</text>
  <text x="105" y="240" text-anchor="middle" font-size="11" fill="#46566b">115200 (B24/C24)</text>
  <text x="105" y="257" text-anchor="middle" font-size="11" fill="#46566b">调试日志</text>

  <rect x="20" y="290" width="170" height="76" rx="6" fill="#ffffff" stroke="#5b6b80"/>
  <text x="105" y="312" text-anchor="middle" font-size="12" fill="#16233b">LED ×8</text>
  <text x="105" y="330" text-anchor="middle" font-size="11" fill="#46566b">retire / trap / DDR / PLL</text>
  <text x="105" y="347" text-anchor="middle" font-size="11" fill="#46566b">默认显示板级诊断</text>

  <!-- arrows -->
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2c4a75"/></marker></defs>
  <line x1="190" y1="87" x2="232" y2="100" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="190" y1="153" x2="232" y2="130" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="405" y1="130" x2="437" y2="130" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="405" y1="220" x2="437" y2="240" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="590" y1="130" x2="617" y2="130" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="750" y1="130" x2="797" y2="130" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="685" y1="174" x2="685" y2="183" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="750" y1="366" x2="797" y2="300" stroke="#2c4a75" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="595" y1="340" x2="595" y2="402" stroke="#2c4a75" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="440" y1="430" x2="400" y2="450" stroke="#b8503f" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
</svg>
